<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>Formación Profesional EC - Enlaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
<style>
:root{color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',system-ui,-apple-system,"Segoe UI",sans-serif}
html{background:#0A1B2E}
body{
  background:linear-gradient(-45deg,#0A1B2E,#1c385c,#E35111,#0A1B2E);
  background-size:400% 400%;
  animation:gradient 15s ease infinite;
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  padding-block:20px;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media (prefers-reduced-motion:reduce){body{animation:none}}
.container{width:100%;max-width:450px;text-align:center}
.profile-img{width:100px;height:100px;border-radius:50%;border:3px solid #fff;margin:0 auto 15px;display:block;box-shadow:0 10px 20px rgba(0,0,0,.2);background-color:#fff;object-fit:contain}
.profile h1{color:#fff;font-size:1.5rem;margin-bottom:5px}
.profile p{color:rgba(255,255,255,.9);font-size:.9rem;margin-bottom:30px}
.links{display:flex;flex-direction:column;gap:15px}
.link-card{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);padding:15px;border-radius:12px;text-decoration:none;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .3s ease}
.link-card:hover{background:rgba(255,255,255,.25);transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.2)}
.link-card:focus-visible{outline:3px solid #fff;outline-offset:3px}
.link-card.highlight{background:#E35111;border:1px solid #ff6a28;box-shadow:0 4px 15px rgba(227,81,17,.4)}
.link-card.highlight:hover{background:#f05a16;box-shadow:0 6px 20px rgba(227,81,17,.6)}
.link-card svg{width:1.2rem;height:1.2rem;flex:none}
footer{margin-top:40px;color:#fff;font-size:.8rem;opacity:.8}
</style>
</head>
<body>

<div class="container">
  <header class="profile">
    <img src="logo.png" alt="Logo Formación Profesional EC" class="profile-img">
    <h1>Formación Profesional EC</h1>
    <p>Educación Continua | Inspirando aprendizaje, desbloqueando potencial.</p>
  </header>

  <main class="links">
    <a href="https://formacionprofessional.netlify.app/#cursos" class="link-card highlight">

      <span>Explorar Nuestros Cursos</span>
    </a>
    <a href="https://wa.me/593962716288?text=Quiero%20m%C3%A1s%20informaci%C3%B3n%20de%20los%20cursos" class="link-card" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>
      <span>Asesoría Personalizada</span>
    </a>
    <a href="https://formacionprofessional.netlify.app/" class="link-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.6 3.8 6 3.8 9.5s-1.2 6.9-3.8 9.5c-2.6-2.6-3.8-6-3.8-9.5s1.2-6.9 3.8-9.5z"/></svg>
      <span>Visitar Sitio Web Oficial</span>
    </a>
    <a href="https://www.facebook.com/formacionprofessional.ec/" class="link-card" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
      <span>Facebook Oficial</span>
    </a>
    <a href="https://www.instagram.com/formacionprofesional.ec/" class="link-card" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      <span>Instagram</span>
    </a>
    <a href="https://www.tiktok.com/@formacionprofesional.ec" class="link-card" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.5 2h-3.3v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.3 6.3 0 1 0 5.3 6.2V8.6a7.6 7.6 0 0 0 4.5 1.5V6.8a4.4 4.4 0 0 1-4.5-4.8z"/></svg>
      <span>TikTok</span>
    </a>
  </main>

  <footer>
    <p>© 2026 Escuela de Formación y Desarrollo Profesional EC</p>
  </footer>
</div>
</body>
</html>
